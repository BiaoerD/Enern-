name: 网上国网
description: 网上国网 Cookie 获取与每日自动签到（每天 8:30 执行）。首次使用需在 App 内登录后打开一次「我的/会员」相关页面以抓取 Cookie。
author: MaYIHEI (script) / BiaoerD (Egern port)
icon: https://raw.githubusercontent.com/MaYIHEI/pin/refs/heads/main/app/sgcc.png

scriptings:
  # 抓取 Cookie：App 内访问会员相关页面时触发
  - http_request:
      name: 网上国网 Cookie
      match: '^https?:\/\/csc-service\.sgcc\.com\.cn:28630\/.+\/member\/'
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/sgcc/sgcc.cookie.js
      body_required: true
      timeout: 30

  # 每天 8:30 自动签到
  - schedule:
      name: 网上国网签到
      cron: '30 8 * * *'
      script_url: https://raw.githubusercontent.com/MaYIHEI/paperclip/refs/heads/main/app/sgcc/sgcc.js
      timeout: 60

mitm:
  hostnames:
    - csc-service.sgcc.com.cn
