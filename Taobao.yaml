name: 淘宝淘金币
description: 淘宝 Cookie 获取 + 淘金币每日自动签到。启用后打开淘宝 App 的淘金币页面抓取 Cookie（Cookie 变化时才通知），每天 8:00 自动签到领金币。
author: BiaoerD

scriptings:
  # 抓取 Cookie：淘宝 App 内 h5api mtop 请求触发
  - http_request:
      name: 淘宝 Cookie
      match: '^https?:\/\/h5api\.m\.taobao\.com\/h5\/mtop\.'
      script_url: https://raw.githubusercontent.com/BiaoerD/Enern-/main/taobao_cookie.js
      timeout: 30

  # 每天 8:00 自动签到 + 领取金币 + 查询余额
  - schedule:
      name: 淘宝淘金币签到
      cron: '0 8 * * *'
      script_url: https://raw.githubusercontent.com/BiaoerD/Enern-/main/taobao_coin.js
      timeout: 60

mitm:
  hostnames:
    - h5api.m.taobao.com
